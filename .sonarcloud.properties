# SonarQube Cloud automatic analysis: tell production code and tests apart, so
# tests get test rules (fake passwords in specs are not vulnerabilities).
# Both sets must stay disjoint: every test pattern is also excluded from sources.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.spec.ts,frontend/src/test-providers.ts,backend/tests/**
sonar.exclusions=**/*.spec.ts,frontend/src/test-providers.ts,backend/tests/**
