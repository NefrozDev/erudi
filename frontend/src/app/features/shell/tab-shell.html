<div class="tab-shell">
  <router-outlet />

  <nav class="tab-bar" [attr.aria-label]="'shell.nav' | transloco">
    <!-- The window's title already names the app: the brand is only for the eye. -->
    <span class="tab-bar__brand" aria-hidden="true">Erudi</span>
    @for (tab of tabs; track tab.path) {
      <a
        class="tab-bar__link"
        [routerLink]="tab.path"
        routerLinkActive="tab-bar__link--active"
        [routerLinkActiveOptions]="{ exact: tab.exact }"
        ariaCurrentWhenActive="page"
      >
        {{ tab.label | transloco }}
      </a>
    }
  </nav>
</div>
