<main class="page">
  <app-plic class="sign-in__plic" />
  <h1 class="title">{{ 'auth.signIn.title' | transloco }}</h1>
  <p class="subtitle">{{ 'auth.signIn.subtitle' | transloco }}</p>

  @if (notice(); as notice) {
    <p class="alert" role="alert">{{ notice | transloco }}</p>
  }

  <div class="page__actions">
    <button class="button" type="button" [disabled]="leaving()" (click)="start()">
      {{ (leaving() ? 'auth.signIn.leaving' : 'auth.signIn.submit') | transloco }}
    </button>
  </div>
</main>
