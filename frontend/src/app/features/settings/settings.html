<main class="page settings">
  <h1 class="title">{{ 'settings.title' | transloco }}</h1>

  <dl class="settings__rows">
    <div class="settings__row">
      <dt>{{ 'settings.account' | transloco }}</dt>
      <dd class="subtitle">{{ auth.user()?.email }}</dd>
    </div>
  </dl>

  <nav class="settings__links" [attr.aria-label]="'settings.title' | transloco">
    <a class="settings__row settings__link" routerLink="/terms">
      {{ 'settings.terms' | transloco }}
    </a>
    <a
      class="settings__row settings__link"
      [href]="accountUrl"
      target="_blank"
      rel="noopener"
      aria-describedby="settings-account-hint"
    >
      {{ 'settings.manageAccount' | transloco }}
    </a>
    <p class="subtitle settings__hint" id="settings-account-hint">
      {{ 'settings.manageAccountHint' | transloco }}
    </p>
  </nav>

  <button
    type="button"
    class="button button--secondary"
    [disabled]="signingOut()"
    (click)="signOut()"
  >
    {{ 'settings.signOut' | transloco }}
  </button>
</main>
