<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <!-- Plic without arms or feet, in its own 200 × 200 frame: each scene adds what it holds. -->
  <ng-template #plic>
    <svg:g stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
      @for (spike of spikes; track spike.angle) {
        <svg:g [attr.transform]="'rotate(' + spike.angle + ' 100 116)'">
          <svg:rect x="83" y="14" width="34" height="56" rx="7" [attr.fill]="spike.fill" />
        </svg:g>
      }
      <svg:circle cx="100" cy="118" r="62" fill="#6f52ff" />
    </svg:g>
    <svg:ellipse cx="76" cy="80" rx="20" ry="10" fill="#ffffff" opacity="0.25" transform="rotate(-22 76 80)" />
    <svg:ellipse cx="100" cy="132" rx="45" ry="38" fill="#ffe7cc" />
    <svg:circle cx="68" cy="142" r="8" fill="#ff9aa8" opacity="0.85" />
    <svg:circle cx="132" cy="142" r="8" fill="#ff9aa8" opacity="0.85" />
    <svg:g class="cel__eyes">
      <svg:g stroke="#17153b" stroke-width="3">
        <svg:circle cx="84" cy="120" r="12" fill="#ffffff" />
        <svg:circle cx="116" cy="120" r="12" fill="#ffffff" />
      </svg:g>
      <svg:circle cx="85" cy="122" r="7.5" fill="#17153b" />
      <svg:circle cx="117" cy="122" r="7.5" fill="#17153b" />
      <svg:circle cx="88" cy="118.5" r="2.6" fill="#ffffff" />
      <svg:circle cx="120" cy="118.5" r="2.6" fill="#ffffff" />
    </svg:g>
    <svg:ellipse cx="100" cy="137" rx="6" ry="4.5" fill="#17153b" />
    <svg:path d="M87 146q13 17 26 0z" fill="#7a1e3a" stroke="#17153b" stroke-width="2.5" stroke-linejoin="round" />
    <svg:ellipse cx="100" cy="154" rx="6" ry="3.5" fill="#ff8fa3" />
  </ng-template>

  <rect class="cel__panel" x="2" y="2" width="316" height="236" rx="28" fill="#fff6ea" stroke="#3b2db0" stroke-width="4" />

  @switch (scene()) {
    @case ('car') {
      <!-- Plic drives in in a convertible, brakes with a nose dive and a puff of dust, gives a
           thumbs up with a blink and a wink of the headlights, then speeds off. -->
      <g stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
        <circle cx="270" cy="46" r="18" fill="#ffe08a" />
        <path d="M40 62q0-12 14-12 4-12 18-10 10-6 18 4 12 0 12 10t-12 8H52q-12 0-12 0z" fill="#ffffff" />
        <path d="M172 36q0-9 10-9 4-9 14-7 8-4 13 3 9 0 9 8t-9 5h-28q-9 0-9 0z" fill="#ffffff" />
      </g>
      <rect x="2" y="208" width="316" height="30" fill="#e9dcc9" />
      <path d="M2 208h316" stroke="#3b2db0" stroke-width="3" />
      <path d="M22 224h26M92 224h26M162 224h26M232 224h26M302 224h26" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <g class="cel-car">
        <g class="cel-car__lines" stroke="#c9cad8" stroke-width="5" stroke-linecap="round">
          <path d="M-14 130h38M-24 156h44M-10 182h30" />
        </g>
        <g fill="#ffffff" stroke="#c9cad8" stroke-width="3">
          @for (puff of [0, 1, 2]; track puff) {
            <g [attr.transform]="'translate(' + (22 - puff * 6) + ' ' + (186 - puff * 4) + ')'">
              <circle class="cel-car__puff" [attr.r]="6 + puff * 2" [style.--delay]="puff * 0.08 + 's'" />
            </g>
          }
        </g>
        <!-- Everything on the springs: it bounces, dives when braking and squats when leaving. -->
        <g class="cel-car__ride">
          <rect x="108" y="112" width="48" height="40" rx="14" fill="#5b3df5" stroke="#3b2db0" stroke-width="3" />
          <g transform="translate(130 132)">
            <path class="cel-car__scarf" d="M0-4q-22-6-44 6l6 10q18-8 38-4z" fill="#ffc93c" stroke="#3b2db0" stroke-width="2.5" stroke-linejoin="round" />
          </g>
          <g transform="translate(95 34) scale(0.62)">
            <ng-container *ngTemplateOutlet="plic" />
          </g>
          <!-- The left hand rises in a thumbs up; the right one keeps the wheel. -->
          <g class="cel-car__thumb" stroke="#3b2db0" stroke-width="3" stroke-linejoin="round" fill="#7d63ff">
            <rect x="100" y="92" width="14" height="34" rx="7" />
            <circle cx="107" cy="90" r="11" />
            <rect x="103" y="64" width="9" height="20" rx="4.5" />
          </g>
          <path d="M150 140h56" stroke="#17153b" stroke-width="4" stroke-linecap="round" />
          <ellipse cx="198" cy="128" rx="4.5" ry="12" fill="none" stroke="#17153b" stroke-width="4" transform="rotate(-18 198 128)" />
          <path d="M184 120l10 6" stroke="#3b2db0" stroke-width="14" stroke-linecap="round" />
          <path d="M184 120l10 6" stroke="#7d63ff" stroke-width="8" stroke-linecap="round" />
          <circle cx="196" cy="126" r="7" fill="#7d63ff" stroke="#3b2db0" stroke-width="3" />
          <g stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
            <path d="M208 142l-12-30 7-3 16 33z" fill="#8fd3ff" fill-opacity="0.75" />
            <path d="M30 170q0-24 24-30l70-4h26q6 0 10 6h60q42 0 64 12q16 10 16 28v4q0 6-6 6H36q-6 0-6-6z" fill="#ff8a8a" />
            <path d="M156 146v36" fill="none" />
            <path d="M164 154h14" stroke-width="4" stroke-linecap="round" />
            <rect x="20" y="182" width="18" height="9" rx="4.5" fill="#c9cad8" />
            <rect x="286" y="182" width="20" height="9" rx="4.5" fill="#c9cad8" />
            <rect x="30" y="158" width="7" height="14" rx="3" fill="#e0475c" />
            <ellipse class="cel-car__light" cx="290" cy="168" rx="6" ry="8" fill="#ffe08a" />
          </g>
          <path d="M42 176h240" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7" />
          <path d="M66 192a26 26 0 0 1 52 0zM212 192a26 26 0 0 1 52 0z" fill="#17153b" />
        </g>
        @for (x of [92, 238]; track x) {
          <g [attr.transform]="'translate(' + x + ' 192)'">
            <g class="cel-car__wheel" stroke="#3b2db0" stroke-width="3">
              <circle r="20" fill="#17153b" />
              <circle r="11" fill="#c9cad8" />
              <path d="M0-11v22M-10-4 10 4M-10 4 10-4" stroke="#8a8ca3" stroke-width="2.5" />
              <circle r="4" fill="#ffc93c" stroke-width="2" />
            </g>
          </g>
        }
        <g fill="#f0e2cf" stroke="#c9b9a3" stroke-width="2.5">
          @for (dust of [{ x: 262, r: 10 }, { x: 276, r: 7 }, { x: 250, r: 6 }]; track dust.x) {
            <g [attr.transform]="'translate(' + dust.x + ' 206)'">
              <circle class="cel-car__dust" [attr.r]="dust.r" />
            </g>
          }
        </g>
        <g transform="translate(96 58)">
          <path class="cel-car__ding" d="M0-12 4-4 12 0 4 4 0 12-4 4-12 0-4-4z" fill="#ffc93c" stroke="#3b2db0" stroke-width="2" stroke-linejoin="round" />
        </g>
      </g>
    }
    @case ('podium') {
      <!-- Plic flexes on the top step while photographers' flashes go off. -->
      <g stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
        <rect x="40" y="178" width="80" height="50" rx="6" fill="#d9d2ff" />
        <rect x="200" y="192" width="80" height="36" rx="6" fill="#bdf2da" />
        <rect x="120" y="156" width="80" height="72" rx="6" fill="#ffc93c" />
      </g>
      <text x="160" y="208" text-anchor="middle" font-family="'Outfit Variable', sans-serif" font-size="34" font-weight="800" fill="#3b2db0">1</text>
      <g class="cel-podium__plic">
        <g transform="translate(100 44) scale(0.6)">
          <g stroke="#3b2db0" stroke-width="3">
            <ellipse cx="76" cy="180" rx="18" ry="9" fill="#fff1df" />
            <ellipse cx="124" cy="180" rx="18" ry="9" fill="#fff1df" />
          </g>
          <ng-container *ngTemplateOutlet="plic" />
          <!-- A double biceps pose, the left arm mirroring the right: the upper arm out from
               the shoulder, the forearm up from the elbow with a fist. The forearm curls in
               towards the head and the biceps swells on top of the upper arm. -->
          @for (side of sides; track side) {
            <g [attr.transform]="side">
              <g fill="#7d63ff" stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
                <g class="cel-podium__forearm">
                  <rect x="186" y="66" width="24" height="58" rx="12" />
                  <!-- The fist, its knuckles towards the head. -->
                  <rect x="182" y="44" width="32" height="30" rx="12" />
                  <path d="M186 54h12M186 63h12" fill="none" stroke-linecap="round" />
                </g>
                <rect x="144" y="104" width="64" height="24" rx="12" />
                <path class="cel-podium__biceps" d="M154 106q16-30 36 0z" />
              </g>
              <g class="cel-podium__strain" fill="none" stroke="#ffc93c" stroke-width="4" stroke-linecap="round">
                <path d="M160 76l-6-10M172 72v-12M184 76l6-10" />
              </g>
            </g>
          }
        </g>
      </g>
      <g fill="#ffffff" stroke="#ffc93c" stroke-width="3" stroke-linejoin="round">
        @for (flash of [{ x: 44, y: 56 }, { x: 278, y: 70 }, { x: 64, y: 132 }, { x: 262, y: 146 }]; track $index) {
          <g [attr.transform]="'translate(' + flash.x + ' ' + flash.y + ')'">
            <path class="cel-podium__flash" d="M0-24 6-6 24 0 6 6 0 24-6 6-24 0-6-6z" />
          </g>
        }
      </g>
    }
    @case ('lab') {
      <!-- Plic throws both arms up and sparkles burst over its head. -->
      <path d="M2 206h316" stroke="#f0e2cf" stroke-width="4" />
      <g transform="translate(160 62)" stroke="#3b2db0" stroke-width="2" stroke-linejoin="round">
        <!-- The blast, behind Plic: a golden glow and a ring, under the sparkles. -->
        <circle class="cel-lab__glow" r="40" fill="#ffe08a" stroke="none" />
        <circle class="cel-lab__ring" r="40" fill="none" stroke="#ffc93c" stroke-width="5" />
        @for (sparkle of sparkles; track $index) {
          <path
            class="cel-lab__sparkle"
            d="M0-10 3-3 10 0 3 3 0 10-3 3-10 0-3-3z"
            [attr.fill]="sparkle.fill"
            [style.--dx]="sparkle.dx"
            [style.--dy]="sparkle.dy"
            [style.--scale]="sparkle.scale"
            [style.--spin]="sparkle.spin"
            [style.--delay]="sparkle.delay"
          />
        }
      </g>
      <g class="cel-lab__plic">
        <g transform="translate(100 92) scale(0.6)">
          <g stroke="#3b2db0" stroke-width="3">
            <ellipse cx="76" cy="180" rx="18" ry="9" fill="#fff1df" />
            <ellipse cx="124" cy="180" rx="18" ry="9" fill="#fff1df" />
          </g>
          <ng-container *ngTemplateOutlet="plic" />
          <!-- Each arm turns at the shoulder, from down at the side to up in a V. -->
          @for (side of sides; track side) {
            <g [attr.transform]="side">
              <g transform="translate(154 118)">
                <g class="cel-lab__arm" fill="#7d63ff" stroke="#3b2db0" stroke-width="3">
                  <rect x="-12" y="-10" width="24" height="76" rx="12" />
                  <circle cy="66" r="14" />
                </g>
              </g>
            </g>
          }
        </g>
      </g>
    }
    @case ('gift') {
      <!-- A gift box opens: Plic springs out, arms up, under a shower of confetti. -->
      <!-- Plic whole, standing on the box once out: feet, body and both arms waving. -->
      <g class="cel-gift__plic">
        <g transform="translate(94 22) scale(0.66)">
          <g stroke="#3b2db0" stroke-width="3">
            <ellipse cx="76" cy="182" rx="20" ry="10" fill="#fff1df" />
            <ellipse cx="124" cy="182" rx="20" ry="10" fill="#fff1df" />
          </g>
          <ng-container *ngTemplateOutlet="plic" />
          @for (side of sides; track side) {
            <g [attr.transform]="side">
              <g class="cel-gift__arm" fill="#7d63ff" stroke="#3b2db0" stroke-width="3">
                <ellipse cx="178" cy="96" rx="13" ry="28" transform="rotate(38 178 96)" />
              </g>
            </g>
          }
        </g>
      </g>
      <g stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
        <rect x="104" y="150" width="112" height="72" rx="6" fill="#ff8a8a" />
        <rect x="152" y="150" width="16" height="72" fill="#ffc93c" />
        <g class="cel-gift__lid">
          <rect x="96" y="134" width="128" height="20" rx="5" fill="#ff8a8a" />
          <rect x="152" y="134" width="16" height="20" fill="#ffc93c" />
          <path d="M160 134q-24-26-30-6t30 6q24-26 30-6t-30 6z" fill="#ffc93c" />
        </g>
      </g>
      @for (piece of confetti; track $index) {
        <g [attr.transform]="'translate(' + piece.x + ' 0)'">
          <rect
            class="cel-gift__confetti"
            x="-4"
            y="-7"
            width="8"
            height="14"
            rx="2"
            [attr.fill]="piece.fill"
            stroke="#3b2db0"
            stroke-width="1.5"
            [style.--drift]="piece.drift"
            [style.--spin]="piece.spin"
            [style.--delay]="piece.delay"
          />
        </g>
      }
    }
    @case ('rocket') {
      <!-- Plic rides a rocket across the panel, leaving a trail of stars. -->
      <g fill="#ffc93c" stroke="#3b2db0" stroke-width="2" stroke-linejoin="round">
        @for (star of [{ x: 52, y: 196 }, { x: 104, y: 160 }, { x: 156, y: 124 }, { x: 208, y: 88 }]; track $index) {
          <g [attr.transform]="'translate(' + star.x + ' ' + star.y + ')'">
            <path class="cel-rocket__star" d="M0-9 3-3 9 0 3 3 0 9-3 3-9 0-3-3z" [style.--delay]="0.25 + $index * 0.3 + 's'" />
          </g>
        }
      </g>
      <g class="cel-rocket">
        <g transform="rotate(-35)">
          <g class="cel-rocket__flame">
            <path d="M-62 0l-26-12q8 12 0 24z" fill="#ffc93c" stroke="#ff8a8a" stroke-width="3" stroke-linejoin="round" />
          </g>
          <g stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
            <path d="M-54-18l-14-14v20zM-54 18l-14 14v-20z" fill="#ff8a8a" />
            <path d="M-60-16h70q30 0 44 16-14 16-44 16h-70z" fill="#ffffff" />
            <circle cx="22" cy="0" r="7" fill="#8fd3ff" />
          </g>
          <g transform="translate(-48 -66) scale(0.4)">
            <ng-container *ngTemplateOutlet="plic" />
          </g>
        </g>
      </g>
    }
  }
</svg>
