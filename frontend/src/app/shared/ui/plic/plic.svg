<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <ellipse cx="100" cy="190" rx="60" ry="7" fill="#17153b" opacity="0.1" />

  <g class="plic__spikes" stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
    @for (spike of spikes; track spike.angle) {
      <g [attr.transform]="'rotate(' + spike.angle + ' 100 116)'">
        <rect x="83" y="14" width="34" height="56" rx="7" [attr.fill]="spike.fill" />
        <path d="M91 28h18M91 38h12" stroke="#17153b" stroke-opacity="0.25" stroke-linecap="round" />
      </g>
    }
  </g>

  <g stroke="#3b2db0" stroke-width="3">
    <ellipse cx="76" cy="180" rx="18" ry="9" fill="#fff1df" />
    <ellipse cx="124" cy="180" rx="18" ry="9" fill="#fff1df" />
    <circle cx="100" cy="118" r="62" fill="#6f52ff" />
    @if (mood() === 'magician') {
      <!-- Both arms raised, as when proud. The left hand holds the deck, face down, and flicks
           a card off it each time one flies. -->
      <g class="plic__toss-arm">
        <ellipse cx="24" cy="102" rx="13" ry="27" fill="#7d63ff" transform="rotate(-42 24 102)" />
        <g class="plic__deck" transform="translate(12 72) rotate(-20)" stroke-width="2.5" stroke-linejoin="round">
          <rect x="-7" y="-11" width="18" height="26" rx="3" fill="#ff8a8a" />
          <rect x="-9" y="-13" width="18" height="26" rx="3" fill="#ff8a8a" />
          <rect x="-5" y="-9" width="10" height="18" rx="1.5" fill="none" stroke="#ffffff" stroke-width="2" />
        </g>
      </g>
      <ellipse cx="176" cy="102" rx="13" ry="27" fill="#7d63ff" transform="rotate(42 176 102)" />
    } @else if (mood() !== 'proud') {
      <ellipse cx="42" cy="130" rx="13" ry="20" fill="#7d63ff" transform="rotate(-12 42 130)" />
      <!-- Its own group: a CSS transform on the ellipse would replace its rotate attribute. -->
      <g class="plic__arm">
        <ellipse cx="158" cy="130" rx="13" ry="20" fill="#7d63ff" transform="rotate(12 158 130)" />
      </g>
    }
  </g>
  <ellipse cx="76" cy="80" rx="20" ry="10" fill="#ffffff" opacity="0.25" transform="rotate(-22 76 80)" />
  @if (mood() === 'magician') {
    <g class="plic__hat" transform="translate(121 61) rotate(16)" stroke="#3b2db0" stroke-width="3" stroke-linejoin="round">
      <rect x="-15" y="-30" width="30" height="30" rx="3" fill="#17153b" />
      <rect x="-15" y="-10" width="30" height="7" fill="#ff8a8a" />
      <ellipse cx="0" cy="0" rx="24" ry="6" fill="#17153b" />
    </g>
  }
  <ellipse cx="100" cy="132" rx="45" ry="38" fill="#ffe7cc" />
  <circle cx="68" cy="142" r="8" fill="#ff9aa8" opacity="0.85" />
  <circle cx="132" cy="142" r="8" fill="#ff9aa8" opacity="0.85" />

  @switch (mood()) {
    @case ('proud') {
      <g fill="none" stroke="#17153b" stroke-width="4.5" stroke-linecap="round">
        <path d="M73 124q11-12 22 0" />
        <path d="M105 124q11-12 22 0" />
      </g>
      <!-- Both arms raised in a cheer: the left one mirrors the right. -->
      <g fill="#7d63ff" stroke="#3b2db0" stroke-width="3">
        @for (side of cheerSides; track side) {
          <g [attr.transform]="side">
            <g class="plic__cheer">
              <ellipse cx="176" cy="102" rx="13" ry="27" transform="rotate(42 176 102)" />
            </g>
          </g>
        }
      </g>
      <g fill="#ffc93c" stroke="#3b2db0" stroke-width="2" stroke-linejoin="round">
        <path class="plic__sparkle" d="M16 24l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" />
        <path class="plic__sparkle" d="M186 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" />
      </g>
    }
    @case ('sleepy') {
      <g fill="none" stroke="#17153b" stroke-width="4" stroke-linecap="round">
        <path d="M73 122q11 9 22 0" />
        <path d="M105 122q11 9 22 0" />
      </g>
      <g fill="#17153b" font-family="'Outfit Variable', sans-serif" font-weight="800">
        <text class="plic__z" x="150" y="60" font-size="22">z</text>
        <text class="plic__z" x="166" y="42" font-size="15">z</text>
      </g>
    }
    @case ('magician') {
      <circle cx="84" cy="120" r="12" fill="#ffffff" stroke="#17153b" stroke-width="3" />
      <circle cx="85" cy="122" r="7.5" fill="#17153b" />
      <circle cx="88" cy="118.5" r="2.6" fill="#ffffff" />
      <!-- The right eye winks now and then. -->
      <g class="plic__wink">
        <circle cx="116" cy="120" r="12" fill="#ffffff" stroke="#17153b" stroke-width="3" />
        <circle cx="117" cy="122" r="7.5" fill="#17153b" />
        <circle cx="120" cy="118.5" r="2.6" fill="#ffffff" />
      </g>
    }
    @default {
      <!-- One group, so both eyes blink together. -->
      <g class="plic__eyes">
        <g stroke="#17153b" stroke-width="3">
          <circle cx="84" cy="120" r="12" fill="#ffffff" />
          <circle cx="116" cy="120" r="12" fill="#ffffff" />
        </g>
        @if (mood() === 'surprised') {
          <circle cx="84" cy="121" r="4" fill="#17153b" />
          <circle cx="116" cy="121" r="4" fill="#17153b" />
        } @else {
          <circle cx="85" cy="122" r="7.5" fill="#17153b" />
          <circle cx="117" cy="122" r="7.5" fill="#17153b" />
          <circle cx="88" cy="118.5" r="2.6" fill="#ffffff" />
          <circle cx="120" cy="118.5" r="2.6" fill="#ffffff" />
        }
      </g>
    }
  }

  <ellipse cx="100" cy="137" rx="6" ry="4.5" fill="#17153b" />

  @switch (mood()) {
    @case ('surprised') {
      <ellipse class="plic__mouth" cx="100" cy="153" rx="6" ry="8" fill="#7a1e3a" />
      <!-- Droplets popping off the head, beyond the spikes. Each points away from the head;
           the outer group places it, so the CSS animation can move it along its own axis. -->
      <g fill="#8fd3ff" stroke="#3b2db0" stroke-width="2.5" stroke-linejoin="round">
        @for (drop of drops; track drop.angle) {
          <g [attr.transform]="'translate(' + drop.x + ' ' + drop.y + ') rotate(' + drop.angle + ')'">
            <path class="plic__drop" d="M0-16c7 9 11 14 11 20a11 11 0 0 1-22 0c0-6 4-11 11-20z" />
          </g>
        }
      </g>
    }
    @case ('sleepy') {
      <path class="plic__mouth" d="M93 150q7 5 14 0" fill="none" stroke="#17153b" stroke-width="3" stroke-linecap="round" />
    }
    @default {
      <path class="plic__mouth" d="M87 146q13 17 26 0z" fill="#7a1e3a" stroke="#17153b" stroke-width="2.5" stroke-linejoin="round" />
      <ellipse cx="100" cy="154" rx="6" ry="3.5" fill="#ff8fa3" />
    }
  }

  @if (mood() === 'magician') {
    <!-- Playing cards flying over the head from the deck to the right hand, in front of
         everything. Three nested groups: across, up and down, and the card's own tilt, each
         with its own animation. -->
    <g transform="translate(12 70)" stroke="#3b2db0" stroke-width="2.5" stroke-linejoin="round">
      @for (card of tossedCards; track $index) {
        <g class="plic__toss-x" [attr.transform]="'translate(' + card.x + ' 0)'" [style.--toss-delay]="card.delay">
          <g class="plic__toss-y" [attr.transform]="'translate(0 ' + card.y + ')'">
            <g class="plic__toss-card" [attr.transform]="'rotate(' + card.angle + ')'">
              <rect x="-9" y="-13" width="18" height="26" rx="3" fill="#ffffff" />
              <path [attr.d]="card.suit" [attr.fill]="card.ink" stroke="none" />
            </g>
          </g>
        </g>
      }
    </g>
    <g fill="#ffc93c" stroke="#3b2db0" stroke-width="2" stroke-linejoin="round">
      <path class="plic__sparkle" d="M22 16l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" />
      <path class="plic__sparkle" d="M182 28l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" />
    </g>
  }
</svg>
